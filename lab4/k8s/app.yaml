apiVersion: apps/v1
kind: Deployment
metadata:
  name: diary-app
  namespace: diary-app
spec:
  selector:
    matchLabels:
      app: diary-app
  template:
    metadata:
      labels:
        app: diary-app
    spec:
      containers:
      - name: diary-app
        image: diary-app:latest
        imagePullPolicy: IfNotPresent
        env:
        - name: DB_HOST
          value: "db-service"
        - name: DB_NAME
          value: "postgres"
        - name: DB_USER
          value: "postgres"
        - name: DB_PASSWORD
          value: "password"
        - name: DB_PORT
          value: "5432"
        stdin: true
        tty: true